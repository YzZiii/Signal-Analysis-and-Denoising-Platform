[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meg-signal-platform"
version = "0.1.0"
description = "Synthetic MEG signal analysis and denoising research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["Algorithm", "UI"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
